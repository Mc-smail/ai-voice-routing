name: Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.timezone }}
    runs-on: ubuntu-latest
    env:
      TZ: ${{ matrix.timezone }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        timezone: [Europe/Berlin, America/Los_Angeles]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check runtime
        run: |
          node --version
          node -e 'require("node:assert/strict").equal(Intl.DateTimeFormat().resolvedOptions().timeZone, process.env.TZ)'
      - name: Run synthetic tests
        run: npm test
